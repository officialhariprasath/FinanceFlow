# Render Blueprint — FinanceFlow / FINNECT Finance OS
# Database: Neon (external). Set DATABASE_URL in Render Dashboard -> financeflow-api -> Environment.

services:
  - type: web
    name: financeflow-api
    region: singapore
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RENDER
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://finnect-finance-os.vercel.app,https://finance-flow-rho-ten.vercel.app
