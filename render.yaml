# Render Blueprint — FinanceFlow / FINNECT Finance OS
# Dashboard: New → Blueprint → connect this repo → Apply
# After deploy: set CORS_ORIGINS to your Vercel URL, then redeploy.

databases:
  - name: financeflow-db
    region: singapore
    plan: free
    databaseName: finnect
    user: finnect

services:
  - type: web
    name: financeflow-api
    region: singapore
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: RENDER
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: financeflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://finnect-finance-os.vercel.app
