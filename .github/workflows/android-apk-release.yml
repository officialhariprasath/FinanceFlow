name: Android APK Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.16)"
        required: true
        default: "v1.2.16"
  push:
    tags:
      - "v1.2.*"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build agent web + sync Capacitor
        working-directory: frontend
        run: |
          npm run build:agent
          npx cap sync android

      - name: Assemble debug APK (upload-signed)
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        id: apk
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then TAG="v1.2.16"; fi
          VER="${TAG#v}"
          OUT="FinanceFlow-v${VER}.apk"
          SRC="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$SRC" "$OUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk }}
          path: ${{ steps.apk.outputs.apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: FinanceFlow ${{ steps.apk.outputs.tag }}
          body: |
            Android agent update ${{ steps.apk.outputs.tag }}

            - Record Payment due / penalty / both collect modes + preview fixes
            - Installment checkbox selection sync (All / Clear / uncheck)
            - Settings sidebar + dedicated notifications page
            - Customer / loan display codes (VMFC / VMFL)
            - Loans UX + CIBIL score from 1.2.15
          files: ${{ steps.apk.outputs.apk }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
